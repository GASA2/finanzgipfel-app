<style>
/* Layout: one-column phone app — sticky title bar, scrolling view, bottom tab bar, round add button, bottom sheets.
   Palette borrows the Swiss banknote series (10 yellow, 20 red, 50 green, 100 blue, 200 brown, 1000 violet) for categories. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --surface2:#e3e9e7; --fg:#14201d; --muted:#5d6b67; --line:#d3dcd9;
  --accent:#1f5f8b; --accent-ink:#ffffff; --accent-soft:#d8e6ef;
  --good:#2f7d4f; --good-soft:#dcefe2; --warn:#a86a00; --warn-soft:#f6e9cc; --bad:#b3362c; --bad-soft:#f6dcd9;
  --n10:#d9a400; --n20:#c8443a; --n50:#3f8a4c; --n100:#2c6aa0; --n200:#8a5a35; --n1000:#7350a6; --n5:#5b8f8a; --n2:#a2577e;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1514; --surface:#17211f; --surface2:#212d2a; --fg:#e6eeeb; --muted:#93a29e; --line:#2a3734;
  --accent:#6fb0dc; --accent-ink:#0b1a24; --accent-soft:#1d3444;
  --good:#6cc28c; --good-soft:#1b3326; --warn:#e3b04f; --warn-soft:#3a2f17; --bad:#ef7d72; --bad-soft:#3d1f1c;
  --n10:#f0c234; --n20:#ec6d61; --n50:#6dbb79; --n100:#64a4d8; --n200:#c08d65; --n1000:#a789d6; --n5:#86bdb7; --n2:#d48bb0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#17211f; --surface2:#212d2a; --fg:#e6eeeb; --muted:#93a29e; --line:#2a3734;
  --accent:#6fb0dc; --accent-ink:#0b1a24; --accent-soft:#1d3444;
  --good:#6cc28c; --good-soft:#1b3326; --warn:#e3b04f; --warn-soft:#3a2f17; --bad:#ef7d72; --bad-soft:#3d1f1c;
  --n10:#f0c234; --n20:#ec6d61; --n50:#6dbb79; --n100:#64a4d8; --n200:#c08d65; --n1000:#a789d6; --n5:#86bdb7; --n2:#d48bb0;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.privacy .pv,.privacy .v-wealth .big,.privacy .v-wealth .amt,.privacy .v-wealth .pill,.privacy .v-wealth .chart,.privacy .v-wealth .li .small{filter:blur(9px);user-select:none;pointer-events:none}
#privBtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
header.top .logo{width:34px;height:34px;border-radius:9px;flex:none;cursor:pointer}
header.top .logo:active{transform:scale(.92)}
header.top h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)} .dot.busy{background:var(--warn)}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.label{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:-.03em;line-height:1.05}
.mid{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em;line-height:1.15}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left}
.tile .mid{font-size:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.statrow .mid{font-size:19px}.statrow .label{text-transform:none;letter-spacing:0;font-size:12.5px}
.stattabs{display:flex;width:100%}.stattabs button{flex:1;padding:9px 6px;font-size:14px}
.mcals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;margin-top:14px}
.mcal{display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.mcal-h{font-size:12px;font-weight:600;color:var(--muted)}
.mcal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cd{display:block;aspect-ratio:1;border-radius:3px;background:var(--surface2)}
.cd.e,.cd.fut{background:transparent}.cd.fut{box-shadow:inset 0 0 0 1px var(--line);opacity:.5}
.cd.z{background:var(--good);opacity:.45}
.cd.l1{background:color-mix(in srgb,var(--bad) 28%,var(--surface2))}.cd.l2{background:color-mix(in srgb,var(--bad) 52%,var(--surface2))}
.cd.l3{background:color-mix(in srgb,var(--bad) 76%,var(--surface2))}.cd.l4{background:var(--bad)}
.cd.t{box-shadow:0 0 0 2px var(--fg)}
.cd.lg{width:12px;height:12px;display:inline-block}
div.tile{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
button.tile{position:relative;cursor:pointer;transition:transform .08s}
button.tile:active{transform:scale(.97);background:var(--surface2)}
button.tile:not(:has(.chev))::after{content:"›";position:absolute;top:8px;right:14px;font-size:22px;line-height:1;color:var(--muted)}
button.tile:not(:has(.chev)) .label{padding-right:16px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:118px;height:118px}
.ring circle{fill:none;stroke-width:12}
.ring .trk{stroke:var(--surface2)}
.ring text{font-family:var(--display);font-weight:700;fill:var(--fg);font-size:22px}
.ring .sub{font-family:var(--body);font-weight:500;font-size:10px;fill:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.idle{background:var(--surface2);color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.li:first-child{border-top:0}
.navrow{padding-block:13px}

.li.sel{width:auto;background:var(--accent-soft);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:12px}
.li .grow,.grow{flex:1;min-width:0}
.li .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:600;white-space:nowrap}
.neg{color:var(--good)}
.bar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.sec-h h2{font-family:var(--display);font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.link{color:var(--accent);font-weight:600;font-size:14px}
.day{margin-top:14px}.day:first-of-type{margin-top:6px}
.day-h{display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:700;color:var(--fg)}
.day-h .dt{color:var(--muted);font-weight:500;margin-left:6px}.day-h .tot{font-weight:600;color:var(--muted)}
.day-h.today{background:var(--accent);color:var(--accent-ink)}
.day-h.today .dt,.day-h.today .tot{color:var(--accent-ink);opacity:.85}
.day:has(.day-h.today) .list{border-left:3px solid var(--accent);padding-left:10px;margin-left:4px}
.day .list{padding:0 2px}
.day.plan .list{opacity:.55}.day.plan .day-h{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;font-size:18px}
.iconbtn:disabled{opacity:.35}
.stack{height:14px;border-radius:7px;overflow:hidden;display:flex;background:var(--surface2)}
.stack>i{display:block;height:100%}
.chart svg{width:100%;height:auto;display:block}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:5px 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 18px;border-radius:14px;font-weight:600;background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.full{width:100%}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;height:64px}
nav.tabs button.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.tab[aria-current="page"]{color:var(--accent)}
.fab{justify-self:center;width:60px;height:60px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 20px -6px color-mix(in srgb,var(--accent) 60%,transparent)}
.fab svg{width:28px;height:28px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .38)}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:24px 24px 0 0;max-height:min(calc(100dvh - 24px - env(safe-area-inset-top,0px)),720px);display:flex;flex-direction:column;overflow:hidden;}
.sbody{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:14px}
.sfoot{flex:none;border-top:1px solid var(--line);background:var(--surface);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.sfoot:empty{display:none}
.sclose{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));width:34px;height:34px;border-radius:10px;background:var(--surface2);font-size:18px;line-height:1;z-index:2}
.chips .more-cat{display:none}.chips.all .more-cat{display:inline-flex}
.sheet .in>.grab+*{padding-right:44px}
.sheet[hidden],.scrim[hidden],[hidden]{display:none!important}

.sheet .in{max-width:560px;margin:0 auto;padding:10px max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 4px}
.sheet h3{font-family:var(--display);font-size:20px;margin:0;font-weight:700}
.amtdisp{font-family:var(--display);font-weight:700;font-size:46px;letter-spacing:-.03em;text-align:center;padding:4px 0}
.amtdisp small{font-size:18px;color:var(--muted);font-weight:500;margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 12px;border-radius:12px;background:var(--surface2);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip .sw{width:8px;height:8px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{height:46px;border-radius:14px;background:var(--surface2);font-size:22px;font-weight:600;font-family:var(--display)}
.keys button:active{background:var(--line)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 12px;font:inherit;font-size:16px;width:100%;min-width:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .wide{grid-column:1/-1}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
details.card summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
details.card summary::-webkit-details-marker{display:none}
details.card summary h2.dh{font-family:var(--display);font-size:17px;font-weight:700;margin:0 0 2px;letter-spacing:-.01em}
details.card summary::after{content:"›";font-size:22px;color:var(--muted);transform:rotate(90deg);transition:.2s}
details.card[open] summary::after{transform:rotate(-90deg)}
.iconbtn.sm{width:30px;height:30px;border-radius:9px;font-size:16px;background:var(--surface2)}
@media (max-width:430px){#syncTxt{display:none}header.top h1{font-size:22px}header.top .logo{width:30px;height:30px}.ynav{font-size:15px}header.top .iconbtn{width:36px;height:36px}}
header.top>.row:first-child{min-width:0;flex:1 1 auto;overflow:hidden}header.top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}header.top>.row:last-child{flex:none}
.ynav{gap:4px;font-family:var(--display);font-size:17px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-wd{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:2px}
.cal-d{height:38px;border-radius:10px;background:var(--surface2);font-weight:600;font-size:14px}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-d[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.note{color:var(--fg);opacity:.72}
.chip.newcat{border:1px solid var(--line);font:inherit;font-size:16px;min-width:0;color:var(--fg)}
input,select,textarea{font-size:16px}
/* Entrance animations: run once when a page opens (class .anim on #view), never on sheets or while typing. */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ringIn{from{stroke-dashoffset:var(--d)}to{stroke-dashoffset:0}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.view.anim>*{animation:fadeUp .4s ease-out both}
.view.anim>*:nth-child(2){animation-delay:.05s}.view.anim>*:nth-child(3){animation-delay:.1s}.view.anim>*:nth-child(4){animation-delay:.15s}.view.anim>*:nth-child(5){animation-delay:.2s}.view.anim>*:nth-child(n+6){animation-delay:.25s}
.view.anim .ring .rf{animation:ringIn .9s cubic-bezier(.2,.7,.2,1) .1s both}
.view.anim .chart rect.gb{transform-box:fill-box;transform-origin:50% 100%;animation:growY .7s cubic-bezier(.2,.7,.2,1) both}
.view.anim .bar>i{transform-origin:0 50%;animation:growX .7s cubic-bezier(.2,.7,.2,1) .15s both}
.view.anim .wl{stroke-dasharray:1;animation:draw 1.2s ease-out .1s both}
.view.anim .fc,.reflow .fc2{transform-box:fill-box;transform-origin:0 50%;animation:growX .7s cubic-bezier(.3,.6,.3,1) .15s both}
.view.anim .fc2{animation-delay:.7s}.reflow .fc2{animation-delay:0s}
.view.anim .fn3{animation:fadeIn .4s ease-out 1.1s both}.reflow .fn3{animation:fadeIn .35s ease-out .45s both}
.view.reanim .wl{stroke-dasharray:1;animation:draw 1.1s ease-out both}.view.reanim .wa,.view.reanim .wd{animation:fadeIn .45s ease-out .8s both}
.view.anim .wa,.view.anim .wd{animation:fadeIn .5s ease-out .9s both}
/* Start screen: the logo builds itself once when the app opens (about 2 s, tap to skip). */
#splash{position:fixed;inset:0;z-index:100;background:#1b2a49;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;animation:spOut .4s ease-in 2.1s forwards}
#splash.gone{animation:spOut .25s ease-in forwards}
#splash .sp-name{font-family:var(--display);font-weight:700;font-size:clamp(30px,9vw,44px);letter-spacing:-.02em;color:#fff;animation:fadeUp .5s ease-out .55s both}
#splash .sp-name span{color:#f2a65a}
#splash svg{width:min(88vw,440px);height:auto;animation:spPop .5s cubic-bezier(.2,.8,.3,1.2) both}
#splash .sp-mtn{animation:fadeUp .5s ease-out .15s both}
#splash .sp-sun{transform-box:fill-box;transform-origin:50% 50%;animation:spSun .7s ease-out .25s both}
#splash .sp-line{stroke-dasharray:1;animation:draw .8s cubic-bezier(.45,.1,.3,1) .45s both}
#splash .sp-head{opacity:0;animation:fadeIn .2s ease-out 1.15s forwards}
#splash .sp-g1,#splash .sp-g2{animation:fadeIn .5s ease-out .35s both}
#splash .sp-g1i,#splash .sp-g2i{transform-box:fill-box;transform-origin:50% 0;animation:spSway 1.8s ease-in-out .35s both}
#splash .sp-g2i{animation-delay:.5s;animation-direction:reverse}
@keyframes spOut{to{opacity:0;visibility:hidden}}
@keyframes spPop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes spSun{from{opacity:0;transform:translateY(18px) scale(.9)}to{opacity:1;transform:none}}
@keyframes spSway{0%{transform:translate(-6px,6px) rotate(-4deg)}50%{transform:translate(5px,-5px) rotate(3deg)}100%{transform:translate(0,0) rotate(0)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}#splash{display:none}}
</style>

</head>

<script>
const MONTHS=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MSHORT=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const PALETTE=["--n100","--n10","--n50","--n20","--n1000","--n200","--n5","--n2"];
const FIXTYPES=["Wohnen","Versicherungen","Krankenkasse","Telefon & Internet","Mobilität","Abos & Medien","Steuern","Sparen & Anlegen","Vorsorge (3. Säule)","Rückstellungen","Ferien","Energie & Nebenkosten","Gebühren & Abgaben","Militär und Zivilschutz","Sonstiges"];
const SAVING_TYPES=["Sparen & Anlegen","Vorsorge (3. Säule)"];
const ACCOUNTS=[["w3","Säule 3a Wert"],["st","Steuerkonto"],["re","Rechnungskonto"],["fe","Ferienkonto"],["ny","New York Konto"],["hb","Hobbykonto"]];

const S={statTab:(()=>{try{return localStorage.getItem('fin-stat')||'money'}catch(e){return'money'}})(),open:{},catFilter:null,settings:null,months:{},verm:null,tab:"home",mKey:null,year:null,wRange:"1y",topMode:"all"};
let db=null, downloads=null, pending=0;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtN=new Intl.NumberFormat("de-CH",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=new Intl.NumberFormat("de-CH",{maximumFractionDigits:0});
const chf=(v,d=2)=>(d?fmtN:fmt0).format(Math.round((v||0)*100)/100);
const pct=v=>(isFinite(v)?Math.round(v*100):0)+" %";
const r2=v=>Math.round(v*100)/100;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const numIn=v=>{let t=String(v??"").trim().replace(/[’'\s]/g,"");if(t.includes(",")&&t.includes("."))t=t.replace(/\./g,"");return parseFloat(t.replace(",","."))};

/* ---------- local cache (fast start, per device) ---------- */
let cacheT=0;function cacheSave(){clearTimeout(cacheT);cacheT=setTimeout(cacheSaveNow,600)}
function cacheSaveNow(){try{localStorage.setItem("fin-cache3",JSON.stringify({settings:S.settings,months:S.months,verm:S.verm}))}catch(e){}}
function cacheLoad(){try{const c=JSON.parse(localStorage.getItem("fin-cache3")||"null");if(c&&c.settings){S.settings=norm(c.settings);S.months=c.months||{};S.verm=c.verm||null;return true}}catch(e){}return false}

/* ---------- calendar ----------
   Months are addressed as year*100+month (202610 = Oktober 2026), so salary and fixed-cost
   changes keep working across the turn of the year. */
const today=()=>new Date();
const todayYear=()=>today().getFullYear();
const nowYM=()=>todayYear()*100+today().getMonth()+1;
const startYear=()=>S.settings?.startYear||2026;
const year=()=>S.year||Math.max(todayYear(),startYear());
function curMonth(y=year()){const t=today();if(t.getFullYear()<y)return 0;if(t.getFullYear()>y)return 13;return t.getMonth()+1}
const openM=(y=year())=>Math.min(Math.max(curMonth(y),1),12);
const ym=(m,y=year())=>y*100+m;
const key=(m,y=year())=>y+"-"+String(m).padStart(2,"0");
const daysIn=(m,y=year())=>new Date(y,m,0).getDate();
function years(){const ys=new Set();for(let y=startYear();y<=Math.max(todayYear(),startYear());y++)ys.add(y);Object.keys(S.months).forEach(k=>ys.add(+k.slice(0,4)));return[...ys].sort()}
const editableYear=()=>year()===todayYear();

/* ---------- money logic (mirrors the Excel) ----------
   Salary and every fixed cost keep a hidden history of dated values. A month's budget uses the
   values valid in that month; a month that has ended stores its budget in its own document. */
function norm(s){if(!s)return s;s=JSON.parse(JSON.stringify(s));const sy=s.startYear||s.year||2026;s.startYear=sy;delete s.year;
  const fx=f=>f>1000?f:sy*100+(+f||1);
  if(!s.salary)s.salary=[{from:1,netto:+s.netto||0,brutto:+s.brutto||0}];
  s.salary=s.salary.map(e=>({...e,from:fx(e.from)}));delete s.netto;delete s.brutto;
  ["fix","fixYear"].forEach(l=>{s[l]=(s[l]||[]).map((f,i)=>{const h=f.h||[{from:1,a:+f.a||0}];return{id:f.id||("o"+l+i),n:f.n,t:f.t,h:h.map(e=>({from:fx(e.from),a:+e.a||0}))}})});
  if(typeof s.hobbyStart!=="object"||s.hobbyStart===null)s.hobbyStart={[sy]:+s.hobbyStart||0};
  if(typeof s.steuerJahr!=="object"||s.steuerJahr===null)s.steuerJahr={[sy]:+s.steuerJahr||0};
  delete s.steuerAngespart;return s}
const valAt=(h,t)=>{let v=0;(h||[]).slice().sort((a,b)=>a.from-b.from).forEach(e=>{if(e.from<=t)v=+e.a||0});return v};
function salAt(t,s=S.settings){let r={netto:0,brutto:0};(s?.salary||[]).slice().sort((a,b)=>a.from-b.from).forEach(e=>{if(e.from<=t)r=e});return r}
const nettoAt=(t,s=S.settings)=>+salAt(t,s).netto||0;
function fixAt(t,s=S.settings){if(!s)return 0;return(s.fix||[]).reduce((a,f)=>a+valAt(f.h,t),0)+(s.fixYear||[]).reduce((a,f)=>a+valAt(f.h,t),0)/12}
function calcBudget(m,y=year(),s=S.settings){const t=ym(m,y);return nettoAt(t,s)-fixAt(t,s)}
function budgetFor(m,y=year()){const d=S.months[key(m,y)];if(d&&typeof d.budget==="number")return d.budget;return calcBudget(m,y)}
function yearPay(k,y=year()){let t=0;for(let m=1;m<=12;m++)t+=+salAt(ym(m,y))[k]||0;return t+(+salAt(ym(12,y))[k]||0)}
function steuerAngespart(y=year()){const s=S.settings;let t=0;for(let m=1;m<=12;m++)t+=(s.fix||[]).filter(f=>f.t==="Steuern").reduce((a,f)=>a+valAt(f.h,ym(m,y)),0);return t+nettoAt(ym(12,y))}
const entries=(m,y=year())=>S.months[key(m,y)]?.entries||[];
const sonder=(m,y=year())=>S.months[key(m,y)]?.sonder||[];
const isKorr=s=>/korrektur/i.test(s.l||"");
const spentCats=(m,y=year())=>entries(m,y).reduce((a,e)=>a+(+e.a||0),0);
const spentSonder=(m,y=year())=>sonder(m,y).filter(s=>!isKorr(s)).reduce((a,s)=>a+(+s.a||0),0);
const spent=(m,y=year())=>spentCats(m,y)+spentSonder(m,y);
function status(m){const c=curMonth(),diff=budgetFor(m)-spent(m);
  if(m>c)return["idle","offen"];if(m===c)return diff>=0?["warn","läuft"]:["bad","über Budget"];return diff>=0?["good","im Budget"]:["bad","über Budget"]}
/* Hobbykonto: start of a year = end of the previous year unless a start value was entered. */
function hobby(y=year()){const hs=S.settings?.hobbyStart||{};let start;
  if(hs[y]!=null)start=+hs[y];else if(y>startYear())start=hobby(y-1).now;else start=0;
  const c=Math.min(curMonth(y),12);let sur=0,taken=0;
  for(let m=1;m<=c;m++){sur+=budgetFor(m,y)-spent(m,y);taken+=sonder(m,y).filter(s=>s.h).reduce((a,s)=>a+Math.abs(+s.a||0),0)}
  return{start,manual:hs[y]!=null,sur,taken,now:start+sur-taken}}
function byType(t){const s=S.settings,map={};(s.fix||[]).forEach(f=>{map[f.t||"Sonstiges"]=(map[f.t||"Sonstiges"]||0)+valAt(f.h,t)});(s.fixYear||[]).forEach(f=>{map[f.t||"Sonstiges"]=(map[f.t||"Sonstiges"]||0)+valAt(f.h,t)/12});return map}
function allCats(){const seen=new Map();(S.settings?.cats||[]).forEach(c=>seen.set(c,1e9));
  for(let m=12;m>=1;m--)entries(m).concat(entries(m,year()-1)).forEach(e=>{seen.set(e.c,(seen.get(e.c)||0)+1)});
  return[...seen.keys()]}
const archived=()=>S.settings?.catArchive||[];
function activeCats(){const ar=archived();return allCats().filter(c=>!ar.includes(c))}
/* Each category keeps its colour for good: the index is stored in settings.catColors once assigned. */
function catColor(name){const cm=S.settings?.catColors||{};let i=cm[name];
  if(i==null){const cats=allCats();i=cats.indexOf(name);if(i<0){i=0;for(const ch of name)i=(i*31+ch.charCodeAt(0))>>>0}}return`var(${PALETTE[i%PALETTE.length]})`}
function ensureCatColor(s,name){s.catColors=s.catColors||{};if(s.catColors[name]==null){const used=Object.values(s.catColors);const counts=PALETTE.map((_,i)=>used.filter(u=>u%PALETTE.length===i).length);s.catColors[name]=counts.indexOf(Math.min(...counts));return true}return false}
function catTotals(ms,y=year()){const t={};ms.forEach(m=>entries(m,y).forEach(e=>{t[e.c]=(t[e.c]||0)+(+e.a||0)}));return Object.entries(t).filter(x=>x[1]).sort((a,b)=>b[1]-a[1])}
/* All costs of the year: every fixed cost over the whole year (with its changes), like the Excel's
   annual view, plus the variable categories so far. The 13th salary goes entirely to taxes. */
function allCostTotals(y=year(),withSavings=true){const c=Math.min(curMonth(y),12),s=S.settings,t={};
  const add=(n,v,kind)=>{if(!v)return;t[n]=t[n]||{v:0,kind};t[n].v+=v};
  for(let m=1;m<=c;m++)entries(m,y).forEach(e=>add(e.c,+e.a||0,"var"));
  for(let m=1;m<=12;m++){
    (s.fix||[]).forEach(f=>{if(!withSavings&&SAVING_TYPES.includes(f.t))return;add(f.n,valAt(f.h,ym(m,y)),"fix")});
    (s.fixYear||[]).forEach(f=>{if(!withSavings&&SAVING_TYPES.includes(f.t))return;add(f.n,valAt(f.h,ym(m,y))/12,"fix")})}
  const tx=(s.fix||[]).find(f=>f.t==="Steuern");if(tx)add(tx.n,nettoAt(ym(12,y)),"fix");
  return Object.entries(t).map(([n,o])=>[n,o.v,o.kind]).filter(x=>Math.abs(x[1])>.004).sort((a,b)=>b[1]-a[1])}

/* ---------- writes (one at a time per document) ---------- */
const chains={};
function setSync(){const d=$("#dot"),t=$("#syncTxt");if(!db){d.className="dot";t.textContent=S.settings?"Offline-Kopie":"Nicht verbunden";return}
  d.className="dot "+(pending?"busy":"on");t.textContent=pending?"Speichert…":"Auf dem Gerät"}
function write(path,data){cacheSave();if(!db){toast("Nicht verbunden: Änderung nur auf diesem Gerät");return}
  pending++;setSync();
  chains[path]=(chains[path]||Promise.resolve()).then(async()=>{
    try{await db.doc(path).set(data)}catch(e){
      if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*800));try{await db.doc(path).set(data)}catch(e2){toast("Speichern fehlgeschlagen: "+(e2.message||e2.code))}}
      else toast(e&&e.code==="invalid_argument"?"Keine Schreibrechte für diese App":"Speichern fehlgeschlagen: "+(e?.message||e?.code||e))}
    finally{pending--;setSync()}});}
function monthDoc(m,y=year()){const d=S.months[key(m,y)];return d?JSON.parse(JSON.stringify(d)):{m,y,entries:[],sonder:[]}}
/* Saving: the sheet closes first, then the page redraws and the write goes out on the next tick,
   so a tap on "Speichern" always gets an immediate visible response. */
let renderT=0;function scheduleRender(){if(renderT)return;renderT=setTimeout(()=>{renderT=0;render()},16)}
function saveMonth(m,doc,y=year()){const k=key(m,y);S.months[k]=doc;scheduleRender();setTimeout(()=>write("months/"+k,doc),0)}
function saveSettings(s){S.settings=s;scheduleRender();setTimeout(()=>write("settings/main",s),0)}
function saveVerm(v){S.verm=v;scheduleRender();setTimeout(()=>write("vermoegen/all",v),0)}

/* ---------- toast & sheet ---------- */
let tt;function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2400)}
let lastSave=0;const once=()=>{const n=Date.now();if(n-lastSave<800)return false;lastSave=n;return true};
/* Sheets: the content scrolls, the action buttons sit in a fixed footer so "Speichern" is always reachable. */
function openSheet(html,bind){const sh=$("#sheet"),foot=$("#sheetFoot");$("#sheetIn").innerHTML='<div class="grab"></div>'+html;foot.innerHTML="";
  const act=$("#sheetIn").querySelector(".actions");if(act)foot.appendChild(act);
  lastSave=0;$("#scrim").hidden=false;sh.hidden=false;$("#sBody").scrollTop=0;fitSheet();bind&&bind(sh)}
function closeSheet(){try{document.activeElement&&document.activeElement.blur&&document.activeElement.blur()}catch(e){}$("#scrim").hidden=true;$("#sheet").hidden=true}
$("#sClose").onclick=closeSheet;
/* Logo = home button: from anywhere back to the overview. */
(()=>{const l=document.querySelector("header.top .logo");if(!l)return;l.setAttribute("role","button");l.setAttribute("tabindex","0");l.setAttribute("aria-label","Zur Übersicht");
  const home=()=>{closeSheet();S.catFilter=null;go("home")};l.addEventListener("click",home);l.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();home()}})})();
/* Phone keyboards: keep the sheet sitting on top of the keyboard while it is open, and force the page to
   re-lay itself out once it closes, so taps land where the buttons are drawn. */
function fitSheet(){const sh=$("#sheet"),vv=window.visualViewport;if(!sh||sh.hidden)return;
  if(vv){const kb=Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop));sh.style.bottom=kb+"px";sh.style.maxHeight=Math.max(260,Math.min(vv.height-16,720))+"px"}
  else{sh.style.bottom="0px";sh.style.maxHeight=""}}
function resync(){fitSheet();const sh=$("#sheet");if(!sh||sh.hidden)return;sh.style.display="none";void sh.offsetHeight;sh.style.display="";
  try{window.scrollTo(window.scrollX,window.scrollY)}catch(e){}}
if(window.visualViewport){visualViewport.addEventListener("resize",fitSheet);visualViewport.addEventListener("scroll",fitSheet)}
window.addEventListener("resize",fitSheet);
document.addEventListener("focusout",()=>{[60,250,500].forEach(t=>setTimeout(resync,t))});
/* Enter / "Fertig" on the phone keyboard saves the open sheet directly. */
document.addEventListener("keydown",e=>{if(e.key!=="Enter"||e.isComposing)return;const t=e.target;if(!t||t.tagName!=="INPUT"||t.id==="q"||t.id==="eNewIn")return;
  const sh=$("#sheet");if(sh.hidden||!sh.contains(t))return;const b=sh.querySelector("#eSave,#fSave,#sSave");if(b){e.preventDefault();t.blur();setTimeout(()=>b.click(),60)}});
$("#scrim").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

function formSheet({title,note,fields,onSave,onDelete,deleteLabel="Löschen",saveLabel="Speichern"}){
  const f=fields.map(x=>{const id="f_"+x.k;let input;
    if(x.type==="select")input=`<select id="${id}">${x.options.map(o=>Array.isArray(o)?`<option value="${o[0]}" ${o[0]==x.v?"selected":""}>${esc(o[1])}</option>`:`<option ${o===x.v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    else if(x.type==="check")return`<label class="toggle wide"><input type="checkbox" id="${id}" ${x.v?"checked":""}>${esc(x.label)}</label>`;
    else input=`<input id="${id}" type="${x.type==="num"?"text":x.type||"text"}" ${x.type==="num"?'inputmode="decimal"':""} value="${esc(x.v??"")}" placeholder="${esc(x.ph||"")}" enterkeyhint="done">`;
    return`<div class="field ${x.half?"":"wide"}"><label for="${id}">${esc(x.label)}</label>${input}</div>`}).join("");
  openSheet(`<h3>${esc(title)}</h3><div class="fields">${f}</div>${note?`<div class="small muted">${note}</div>`:""}
    <div class="row actions" style="gap:8px">${onDelete?`<button class="btn danger" id="fDel">${esc(deleteLabel)}</button>`:""}<button class="btn primary" style="flex:1" id="fSave">${esc(saveLabel)}</button></div>`,el=>{
    const vals=()=>{const v={};for(const x of fields){const n=el.querySelector("#f_"+x.k);
        v[x.k]=x.type==="check"?n.checked:x.type==="num"?(n.value.trim()===""?null:numIn(n.value)):n.value.trim()}return v};
    el.querySelector("#fSave").onclick=()=>{if(!once())return;if(onSave(vals())!==false)closeSheet()};
    const del=el.querySelector("#fDel");if(del)del.onclick=()=>{if(del.dataset.sure){onDelete(vals());closeSheet()}else{del.dataset.sure=1;del.textContent="Wirklich?"}};
  })}

/* ---------- entry sheet: keypad + multi-day calendar ---------- */
function calHtml(m,y,sel){const first=(new Date(y,m-1,1).getDay()+6)%7,n=daysIn(m,y),t=today();
  let h=["Mo","Di","Mi","Do","Fr","Sa","So"].map(d=>`<span class="cal-wd">${d}</span>`).join("");
  for(let i=0;i<first;i++)h+="<span></span>";
  for(let d=1;d<=n;d++){const isT=t.getFullYear()===y&&t.getMonth()+1===m&&t.getDate()===d;h+=`<button class="cal-d${isT?" today":""}" data-day="${d}" aria-pressed="${sel.has(d)}">${d}</button>`}
  return h}
function entrySheet(m,existing,preset){
  const t=today(),y=year(),isCur=y===t.getFullYear();
  m=m||(isCur?t.getMonth()+1:S.mKey||1);
  const src=existing||preset;const st={amt:src?String(src.a).replace(".",","):"",cat:src?.c||null,m:existing?._m||m,days:new Set([existing?.d||(isCur&&m===t.getMonth()+1?t.getDate():1)]),note:src?.n||""};
  const recent={};for(let k=0;k<3;k++)entries(st.m-k).forEach(e=>{recent[e.c]=(recent[e.c]||0)+1});
  const cats=activeCats().concat(st.cat&&!activeCats().includes(st.cat)?[st.cat]:[]).sort((a,b)=>(recent[b]||0)-(recent[a]||0));
  const freq={};entries(st.m).concat(entries(st.m-1)).forEach(e=>{const k=e.c+"|"+e.a;freq[k]=(freq[k]||0)+1});
  const quick=Object.entries(freq).filter(x=>x[1]>=3).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>{const[c,a]=x[0].split("|");return{c,a:+a}});
  const dateBlock=existing
    ?`<div class="fields"><div class="field"><label for="eDate">Datum</label><input type="date" id="eDate"></div><div class="field"><label for="eNote">Notiz</label><input id="eNote" enterkeyhint="done" placeholder="Was war es?" value="${esc(st.note)}"></div></div>`
    :`<div><div class="row between" style="margin-bottom:6px"><span class="label">Tage <span id="eCount" style="text-transform:none;letter-spacing:0"></span></span>
        <div class="row" style="gap:4px"><button class="iconbtn sm" id="cPrev" aria-label="Vormonat">‹</button><b id="cMonth" style="min-width:92px;text-align:center"></b><button class="iconbtn sm" id="cNext" aria-label="Nächster Monat">›</button></div></div>
        <div class="cal" id="cal"></div>
        <div class="chips" style="margin-top:8px"><button class="chip" id="cToday">Nur heute</button><button class="chip" id="cWork">Alle Werktage</button><button class="chip" id="cNone">Keine</button></div></div>
      <div class="field"><label for="eNote">Notiz</label><input id="eNote" enterkeyhint="done" placeholder="Was war es? (optional)" value="${esc(st.note)}"></div>`;
  openSheet(`<div class="row between"><h3>${existing?"Ausgabe bearbeiten":"Ausgabe erfassen"}</h3><span class="muted small" id="eWhen"></span></div>
    ${!existing&&quick.length?`<div><div class="label" style="margin-bottom:6px">Schnell</div><div class="chips">${quick.map((q,i)=>`<button class="chip" data-q="${i}"><span class="sw" style="background:${catColor(q.c)}"></span>${esc(q.c)} · ${chf(q.a)}</button>`).join("")}</div></div>`:""}
    <div class="amtdisp" id="eAmt"></div>
    <div class="keys">${["1","2","3","4","5","6","7","8","9",",","0","⌫"].map(k=>`<button data-k="${k}" aria-label="${k==="⌫"?"Löschen":k}">${k}</button>`).join("")}</div>
    <div><div class="label" style="margin-bottom:6px">Kategorie</div><div class="chips" id="eCats">${cats.map((c,i)=>`<button class="chip${i>=12&&c!==st.cat?" more-cat":""}" data-c="${esc(c)}"><span class="sw" style="background:${catColor(c)}"></span>${esc(c)}</button>`).join("")}${cats.length>12?`<button class="chip" id="eAll">Alle (${cats.length})</button>`:""}<button class="chip" id="eNew">+ Neu</button></div></div>
    ${dateBlock}
    ${existing?'<button class="link" id="eDup" style="align-self:flex-start">Nochmals erfassen (Kopie für ein anderes Datum)</button>':""}
    <div class="row actions" style="gap:8px">${existing?'<button class="btn danger" id="eDel">Löschen</button>':""}<button class="btn primary" style="flex:1" id="eSave">Speichern</button></div>`,el=>{
    const upd=()=>{el.querySelector("#eAmt").innerHTML=`<small>CHF</small>${st.amt?esc(st.amt):'<span class="muted">0</span>'}`;
      el.querySelectorAll("#eCats [data-c]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===st.cat));
      const ds=[...st.days].sort((a,b)=>a-b);
      if(existing){el.querySelector("#eDate").value=`${y}-${String(st.m).padStart(2,"0")}-${String(ds[0]).padStart(2,"0")}`;el.querySelector("#eWhen").textContent=`${ds[0]}. ${MONTHS[st.m-1]}`}
      else{el.querySelector("#cal").innerHTML=calHtml(st.m,y,st.days);el.querySelector("#cMonth").textContent=MONTHS[st.m-1];
        el.querySelector("#cPrev").disabled=st.m<=1;el.querySelector("#cNext").disabled=st.m>=12;
        const a=numIn(st.amt)||0;el.querySelector("#eCount").textContent=ds.length>1?`· ${ds.length} Tage = CHF ${chf(a*ds.length)}`:"";
        el.querySelector("#eWhen").textContent=ds.length===1?`${ds[0]}. ${MONTHS[st.m-1]}`:ds.length?`${ds.length} Einträge`:"";
        el.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{const d=+b.dataset.day;st.days.has(d)?st.days.delete(d):st.days.add(d);upd()})}};
    el.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;
      if(k==="⌫")st.amt=st.amt.slice(0,-1);else if(k===","){if(!st.amt.includes(","))st.amt=(st.amt||"0")+","}
      else{const p=st.amt.split(",");if(p[1]&&p[1].length>=2)return;if(st.amt==="0")st.amt="";if(st.amt.replace(",","").length<7)st.amt+=k}upd()});
    el.querySelectorAll("#eCats [data-c]").forEach(b=>b.onclick=()=>{st.cat=b.dataset.c;upd()});
    const ea=el.querySelector("#eAll");if(ea)ea.onclick=()=>{el.querySelector("#eCats").classList.add("all");ea.remove()};
    el.querySelector("#eNew").onclick=()=>{const wrap=el.querySelector("#eCats");if(wrap.querySelector("#eNewIn"))return;
      const i=document.createElement("input");i.id="eNewIn";i.placeholder="Neue Kategorie";i.className="chip newcat";
      wrap.appendChild(i);i.focus();i.oninput=()=>{st.cat=i.value.trim()||null;el.querySelectorAll("#eCats [data-c]").forEach(b=>b.setAttribute("aria-pressed","false"))}};
    el.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const q=quick[+b.dataset.q];st.cat=q.c;st.amt=String(q.a).replace(".",",");upd()});
    if(existing)el.querySelector("#eDate").onchange=e=>{const[yy,mm,dd]=e.target.value.split("-").map(Number);if(yy!==y){toast("Nur Daten in "+y);upd();return}st.m=mm;st.days=new Set([dd]);upd()};
    else{
      el.querySelector("#cPrev").onclick=()=>{st.m=Math.max(1,st.m-1);st.days=new Set();upd()};
      el.querySelector("#cNext").onclick=()=>{st.m=Math.min(12,st.m+1);st.days=new Set();upd()};
      el.querySelector("#cToday").onclick=()=>{if(isCur){st.m=t.getMonth()+1;st.days=new Set([t.getDate()])}else st.days=new Set([1]);upd()};
      el.querySelector("#cWork").onclick=()=>{st.days=new Set();for(let d=1;d<=daysIn(st.m,y);d++){const w=new Date(y,st.m-1,d).getDay();if(w>0&&w<6)st.days.add(d)}upd()};
      el.querySelector("#cNone").onclick=()=>{st.days=new Set();upd()};
    }
    el.querySelector("#eSave").onclick=()=>{if(!once())return;const a=numIn(st.amt);
      if(!a){toast("Betrag eingeben");return}if(!st.cat){toast("Kategorie wählen");return}if(!st.days.size){toast("Mindestens einen Tag wählen");return}
      st.note=el.querySelector("#eNote").value.trim();
      if(existing){const e={id:existing.id,d:[...st.days][0],c:st.cat,a:r2(a)};if(st.note)e.n=st.note;
        if(existing._m!==st.m){const old=monthDoc(existing._m);old.entries=old.entries.filter(x=>x.id!==existing.id);saveMonth(existing._m,old)}
        const doc=monthDoc(st.m);const i=doc.entries.findIndex(x=>x.id===e.id);if(i>=0)doc.entries[i]=e;else doc.entries.push(e);closeSheet();saveMonth(st.m,doc);toast("Gespeichert");return}
      if(S.settings&&!(S.settings.catColors||{})[st.cat]){const s2=JSON.parse(JSON.stringify(S.settings));if(ensureCatColor(s2,st.cat))saveSettings(s2)}
      const doc=monthDoc(st.m);[...st.days].sort((p,q)=>p-q).forEach(d=>{const e={id:uid(),d,c:st.cat,a:r2(a)};if(st.note)e.n=st.note;doc.entries.push(e)});
      closeSheet();saveMonth(st.m,doc);toast(st.days.size>1?`${st.days.size} Einträge ${st.cat} gespeichert`:`${st.cat}: CHF ${chf(a)} gespeichert`)};
    const dup=el.querySelector("#eDup");if(dup)dup.onclick=()=>{closeSheet();setTimeout(()=>entrySheet(existing._m,null,{c:existing.c,a:existing.a,n:existing.n}),40)};
    const del=el.querySelector("#eDel");if(del)del.onclick=()=>{if(!del.dataset.sure){del.dataset.sure=1;del.textContent="Wirklich löschen?";return}
      const doc=monthDoc(existing._m);doc.entries=doc.entries.filter(x=>x.id!==existing.id);saveMonth(existing._m,doc);closeSheet();toast("Gelöscht")};
    upd();
  })}
$("#fab").onclick=()=>{if(!S.settings){toast("Daten noch nicht geladen");return}entrySheet(S.tab==="month"?S.mKey:null)};

/* ---------- views ---------- */
function ring(frac,label,sub,warn){const r=50,c=2*Math.PI*r,f=Math.max(0,Math.min(1,frac));const col=frac>1?"var(--bad)":warn||frac>.85?"var(--warn)":"var(--accent)";
  return`<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="${pct(frac)} vom Budget verbraucht"><circle class="trk" cx="60" cy="60" r="${r}"/><circle class="rf" style="--d:${c*f}" cx="60" cy="60" r="${r}" stroke="${col}" stroke-linecap="round" stroke-dasharray="${c*f} ${c}" transform="rotate(-90 60 60)"/><text x="60" y="62" text-anchor="middle">${label}</text><text class="sub" x="60" y="80" text-anchor="middle">${sub}</text></svg>`}
const barRow=(n,v,max,color,sub="")=>`<div class="li"><span class="sw" style="background:${color}"></span><div class="grow"><div class="row between"><span class="t">${esc(n)}${sub}</span><span class="amt">${chf(v)}</span></div><div class="bar" style="margin-top:6px"><i style="width:${Math.max(0,v/max*100)}%;background:${color}"></i></div></div></div>`;

/* Budget vs. spending per month as bars; each month is a tap target that opens it. */
function monthChart(){const c=curMonth(),W=340,H=168,pl=4,pr=4,pt=18,pb=22,n=12,gw=(W-pl-pr)/n;
  const vals=MONTHS.map((_,i)=>({b:budgetFor(i+1),s:spent(i+1)}));const mx=Math.max(1,...vals.map(v=>Math.max(v.b,v.s)))*1.08;
  const y=v=>pt+(H-pt-pb)*(1-v/mx);let g="";
  vals.forEach((v,i)=>{const m=i+1,x=pl+i*gw,bw=gw*.62,bx=x+(gw-bw)/2,sw=gw*.4,sx=x+(gw-sw)/2,open=m>c,col=m===c?"var(--accent)":v.s>v.b?"var(--bad)":"var(--good)";
    g+=`<g data-month="${m}" style="cursor:pointer"><rect x="${x}" y="0" width="${gw}" height="${H}" fill="transparent"/>
      <rect class="gb" style="animation-delay:${i*.03}s" x="${bx}" y="${y(v.b)}" width="${bw}" height="${H-pb-y(v.b)}" rx="${bw/2}" fill="var(--surface2)" stroke="var(--line)"/>
      ${open?"":`<rect class="gb" style="animation-delay:${.15+i*.03}s" x="${sx}" y="${y(v.s)}" width="${sw}" height="${Math.max(0,H-pb-y(v.s))}" rx="${sw/2}" fill="${col}"/>`}
      <text x="${x+gw/2}" y="${H-7}" text-anchor="middle" font-size="10" fill="${m===c?"var(--fg)":"var(--muted)"}" font-weight="${m===c?700:500}">${MSHORT[i].slice(0,1)}</text>
</g>`});

function wChart(rows){

  const vals=rows.map(r=>r.t);let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*.08||1000;lo-=pad;hi+=pad;
  const step=[1000,2000,5000,10000,20000,25000,50000,100000].find(s=>(hi-lo)/s<=4)||100000;lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const x=i=>pl+i*(W-pl-pr)/(rows.length-1),y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  let g="";for(let v=lo;v<=hi+1;v+=step)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)">${privacy?"":v>=1000?fmt0.format(v/1000)+"k":v}</text>`;

  const lx=x(rows.length-1),ly=y(rows[rows.length-1].t);
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf Gesamtvermögen">${g}
    <polygon class="wa" points="${pl},${y(lo)} ${pts.join(" ")} ${W-pr},${y(lo)}" fill="var(--accent)" fill-opacity=".14"/>
    <polyline class="wl" pathLength="1" points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <circle class="wd" cx="${lx}" cy="${ly}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>${lab.join("")}</svg>`}

    <div class="small muted" style="margin-top:8px">Jahreslohn inkl. 13. Monatslohn, mit allen Lohnänderungen im ${y}.</div>${ro}</section>
  <section class="card"><div class="sec-h"><h2>Budget ${MONTHS[m-1]}</h2><button class="link" id="editFood">Einstellungen</button></div><div class="list">

  <details class="card" data-k="fix" ${S.open["fix"]?"open":""}><summary><div style="min-width:0"><h2 class="dh">Monatliche Fixkosten</h2><div class="small muted">Total ${chf(ft)} pro Monat inkl. jährliche ÷ 12</div></div></summary>

  <details class="card" data-k="fixy" ${S.open["fixy"]?"open":""}><summary><div style="min-width:0"><h2 class="dh">Jährliche Fixkosten</h2><div class="small muted">Total ${chf((s.fixYear||[]).reduce((a,f)=>a+valAt(f.h,t),0))} pro Jahr</div></div></summary>
    ${ed?'<button class="link" data-addfix="fixYear" style="margin-top:8px">+ Neue jährliche Fixkosten</button>':""}
<div class="list" style="margin-top:8px">
    ${fixList("fixYear",true)}
    <div class="li"><span class="grow"><b>Total jährlich</b></span><span class="amt">${chf((s.fixYear||[]).reduce((a,f)=>a+valAt(f.h,t),0))}</span></div>${endedList("fixYear",true)}</div></details>
  <details class="card" data-k="tax" ${S.open["tax"]?"open":""}><summary><div style="min-width:0"><h2 class="dh">Steuern-Check ${y}</h2><div class="small muted">${stJ?(stDiff>=0?"Abgedeckt":"Lücke")+" · "+(stDiff>=0?"+":"")+chf(stDiff):"Steuerbetrag noch nicht eingetragen"}</div></div></summary>
<div style="margin-top:10px"><div class="row between"><div><div class="label">Angespart</div><div class="mid">${chf(stA,0)}</div></div><div style="text-align:right"><div class="label">Steuern ${y}</div><div class="mid">${stJ?chf(stJ,0):"–"}</div></div></div>
    <div class="small muted" style="margin-top:6px">Steuer-Raten aller Monate + 13. Monatslohn</div>
    <div style="margin-top:10px">${stJ?`<span class="pill ${stDiff>=0?"good":"bad"}">${stDiff>=0?"Abgedeckt":"Lücke"} · ${stDiff>=0?"+":""}${chf(stDiff)}</span>`:'<span class="pill idle">Steuerbetrag noch nicht eingetragen</span>'}</div><button class="link" id="editTax" style="margin-top:10px">Steuerbetrag eintragen</button></div></details>
  <section class="card"><div class="sec-h"><h2>Hobbykonto</h2><button class="link" id="editHobby">Startwert</button></div><div class="list">

    <div class="li"><span class="grow">+ Überschüsse bis ${MONTHS[m-1]}</span><span class="amt">${chf(h.sur)}</span></div>
    <div class="li"><span class="grow">− vom Hobbykonto bezogen</span><span class="amt">${chf(-h.taken)}</span></div>
    <div class="li"><span class="grow"><b>Stand ${ed?"aktuell":"Ende "+y}</b></span><span class="amt" style="color:var(--accent)">${chf(h.now)}</span></div></div>
    ${h.sur>0?`<div class="small muted" style="margin-top:6px">${pct(h.taken/h.sur)} vom Überschuss wieder ausgegeben</div>`:""}</section>
  <section class="card"><div class="sec-h"><h2>Daten</h2></div><div class="small muted">Deine Daten sind nur auf diesem Gerät gespeichert, nirgends online. Mach deshalb regelmässig eine Sicherung.</div>

    <button class="btn full" id="restore" style="margin-top:10px">Sicherung laden</button>
    <div class="small muted" style="margin-top:6px">Ersetzt alle Daten auf diesem Gerät durch die gewählte Sicherung.</div>
    <button class="btn full" id="export" style="margin-top:10px">Ausgaben ${y} als CSV (für Excel)</button></section>
  <div class="small muted" style="text-align:center;padding:4px 0 8px">Finanzgipfel · Version ${APP_VERSION}</div>`}

/* ---------- render + events ---------- */
/* ---------- Abo-Check ----------
   Subscriptions are fixed costs: by default those of type "Abos & Medien" or "Telefon & Internet" and
   anything named "Abo"; each can be switched on or off. Payment dates come from the info table
   (Fixkosten & Rechnungen) where the position matches the fixed cost's name. */
const ABO_TYPES=["Abos & Medien","Telefon & Internet"];
const MARKS=[["keep","Behalten"],["check","Prüfen"],["cancel","Kündigen"]];
const aboCfg=f=>(S.settings.abo||{})[f.id]||{};
const aboOn=f=>{const c=aboCfg(f);return c.on!=null?c.on:(ABO_TYPES.includes(f.t)||/\babo\b/i.test(f.n))};
function aboPayments(name){const r=[],n=String(name).toLowerCase();
  for(const k of Object.keys(S.months)){const y=+k.slice(0,4),m=+k.slice(5);(S.months[k].info||[]).forEach(x=>{if(String(x.p||"").toLowerCase()===n)r.push({y,m,d:x.d,a:+x.a||0,date:new Date(y,m-1,x.d)})})}
  return r.sort((a,b)=>b.date-a.date)}
function addMonths(dt,k){const d=new Date(dt.getFullYear(),dt.getMonth()+k,1);d.setDate(Math.min(dt.getDate(),new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return d}
function aboList(){const now=nowYM(),t0=new Date(today().getFullYear(),today().getMonth(),today().getDate()),out=[];
  [["fix",false],["fixYear",true]].forEach(([l,yearly])=>(S.settings[l]||[]).forEach(f=>{
    const cur=valAt(f.h,now),pays=aboPayments(f.n),last=pays[0];
    const endE=(f.h||[]).filter(e=>e.from<=now).sort((a,b)=>b.from-a.from)[0];
    const ended=cur===0&&(f.h||[]).some(e=>+e.a);
    const paidAfterEnd=ended&&last&&endE&&(last.y*100+last.m)>endE.from?last:null;
    if(!aboOn(f)||(ended&&!paidAfterEnd)||(!ended&&cur===0))return;
    const endE2=(f.h||[]).filter(e=>e.from>now&&!+e.a).sort((a,b)=>a.from-b.from)[0],endsAt=endE2?ymAdd(endE2.from,-1):null;
    let next=null;if(last&&!ended){next=last.date;let g=0;while(next<t0&&g++<400)next=addMonths(next,yearly?12:1);if(endsAt&&next.getFullYear()*100+next.getMonth()+1>endsAt)next=null}
    const perMonth=yearly?cur/12:cur,perYear=yearly?cur:cur*12;
    const change=pays.length>1&&Math.abs(pays[0].a-pays[1].a)>.009?r2(pays[0].a-pays[1].a):0;
    out.push({f,l,yearly,cur,perMonth,perYear,pays,last,next,days:next?Math.round((next-t0)/864e5):null,change,ended,paidAfterEnd,endsAt,mark:aboCfg(f).mark||"keep"})}));
  return out.sort((a,b)=>b.perYear-a.perYear)}
const APP_VERSION="1.1";
const ymLabel=(t,short)=>(short?MSHORT:MONTHS)[t%100-1]+" "+Math.floor(t/100);
const ymAdd=(t,k)=>{let y=Math.floor(t/100),m=t%100+k;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y*100+m};
function monthChoices(){const y=todayYear(),o=[];for(let m=1;m<=12;m++)o.push([ym(m,y),ymLabel(ym(m,y))]);return o}
/* History of a fixed cost as periods {from,to,a}; to=null = still running, a=0 = ended. */
function periods(f){const h=(f.h||[]).slice().sort((a,b)=>a.from-b.from),out=[];
  h.forEach((e,i)=>out.push({from:e.from,to:h[i+1]?ymAdd(h[i+1].from,-1):null,a:+e.a||0}));
  while(out.length&&!out[0].a)out.shift();return out.filter((x,i)=>x.a||i===out.length-1||out[i+1].a)}
function paidSoFar(f,yearly){const now=nowYM();let t=0,c=ym(1,startYear()),g=0;while(c<=now&&g++<600){t+=valAt(f.h,c)/(yearly?12:1);c=ymAdd(c,1)}return t}
const isEnded=f=>valAt(f.h,nowYM())===0&&(f.h||[]).some(e=>+e.a);
function histHtml(f,yearly){const p=periods(f);if(!p.length)return"";
  const rows=p.map(x=>x.a?`<div class="li"><span class="grow">${ymLabel(x.from,1)} – ${x.to?ymLabel(x.to,1):"heute"}</span><span class="amt">${chf(x.a)}${yearly?" / J.":" / Mt."}</span></div>`
    :`<div class="li"><span class="grow muted">Beendet ab ${ymLabel(x.from,1)}</span><span class="amt muted">–</span></div>`).join("");
  return`<div><div class="label" style="margin-bottom:2px">Verlauf</div><div class="list">${rows}</div><div class="small muted" style="margin-top:4px">Bisher bezahlt seit ${ymLabel(ym(1,startYear()),1)}: ${chf(paidSoFar(f,yearly),0)} CHF</div></div>`}
const fmtD=d=>d.toLocaleDateString("de-CH",{day:"numeric",month:"short",year:d.getFullYear()!==today().getFullYear()?"numeric":undefined});
function saveAbo(id,patch){const s=JSON.parse(JSON.stringify(S.settings));s.abo=s.abo||{};s.abo[id]={...(s.abo[id]||{}),...patch};saveSettings(s)}

function vAbos(){
  const list=aboList(),act=list.filter(a=>!a.ended),gone=list.filter(a=>a.ended);
  const pm=act.reduce((s,a)=>s+a.perMonth,0),py=act.reduce((s,a)=>s+a.perYear,0),net=nettoAt(nowYM());
  const save=act.filter(a=>a.mark!=="keep"&&!a.endsAt).reduce((s,a)=>s+a.perYear,0);
  const soon=act.filter(a=>a.yearly&&a.days!=null&&a.days<=30);
  const markPill=a=>{if(a.endsAt)return`<span class="pill bad">Gekündigt</span>`;const m=MARKS.find(x=>x[0]===a.mark);return`<span class="pill ${a.mark==="keep"?"good":a.mark==="check"?"warn":"bad"}">${m[1]}</span>`};
  const others=[...(S.settings.fix||[]).map(f=>[f,"fix"]),...(S.settings.fixYear||[]).map(f=>[f,"fixYear"])].filter(([f])=>!aboOn(f)&&valAt(f.h,nowYM())!==0&&!SAVING_TYPES.includes(f.t)&&f.t!=="Steuern");
  return`
  <button class="link" data-go="plan" style="align-self:flex-start">‹ Planung</button>
  <section class="card"><div class="label">Abos · ${act.length} aktiv</div>
    <div class="row" style="gap:18px;align-items:baseline;flex-wrap:wrap"><div class="big">${chf(pm)}</div><span class="muted">pro Monat</span></div>
    <div class="small muted">${chf(py,0)} CHF pro Jahr · ${pct(net?pm/net:0)} vom Netto</div>
    ${save>0?`<div style="margin-top:10px"><span class="pill warn">Sparpotenzial ${chf(save,0)} / Jahr</span> <span class="small muted">wenn du die markierten kündigst</span></div>`:""}
  </section>
  ${gone.length||soon.length?`<section class="card"><div class="sec-h"><h2>Achtung</h2></div><div class="list">
    ${gone.map(a=>`<button class="li" data-abo="${a.l}:${a.f.id}"><span class="sw" style="background:var(--bad)"></span><div class="grow"><div class="t">${esc(a.f.n)}</div><div class="small" style="color:var(--bad)">Gekündigt, aber am ${fmtD(a.paidAfterEnd.date)} noch ${chf(a.paidAfterEnd.a)} bezahlt</div></div></button>`).join("")}
    ${soon.map(a=>`<button class="li" data-abo="${a.l}:${a.f.id}"><span class="sw" style="background:var(--warn)"></span><div class="grow"><div class="t">${esc(a.f.n)}</div><div class="small" style="color:var(--warn)">Verlängert sich ${a.days===0?"heute":"in "+a.days+" Tagen"} (${fmtD(a.next)}) für ${chf(a.cur)}</div></div></button>`).join("")}
  </div></section>`:""}
  <section class="card"><div class="sec-h"><h2>Deine Abos</h2><button class="link" id="addAbo">+ Neu</button></div>
    <div class="small muted" style="margin-bottom:2px">Tippen zum Markieren, Ändern oder Kündigen.</div><div class="list">
    ${act.map(a=>`<button class="li" data-abo="${a.l}:${a.f.id}"><div class="grow"><div class="row" style="gap:8px"><span class="t">${esc(a.f.n)}</span>${markPill(a)}</div>
      <div class="small muted">${a.yearly?"jährlich":"monatlich"}${a.endsAt?` · gekündigt, läuft bis ${ymLabel(a.endsAt,1)}`:a.next?` · nächste Zahlung ${a.days===0?"heute":fmtD(a.next)}`:" · kein Zahlungsdatum erfasst"}</div>
      ${a.change?`<div class="small" style="color:${a.change>0?"var(--bad)":"var(--good)"};font-weight:600">zuletzt ${a.change>0?"+":""}${chf(a.change)} ${a.change>0?"teurer":"günstiger"} (${chf(a.pays[1].a)} → ${chf(a.pays[0].a)})</div>`:""}</div>
      <div style="text-align:right"><div class="amt">${chf(a.perMonth)}</div><div class="small muted">${chf(a.perYear,0)} / J.</div></div></button>`).join("")||'<div class="empty">Keine Abos erfasst</div>'}
  </div></section>
  ${(()=>{const ids=new Set(list.map(a=>a.f.id)),ex=[...(S.settings.fix||[]).map(f=>[f,"fix"]),...(S.settings.fixYear||[]).map(f=>[f,"fixYear"])].filter(([f])=>aboOn(f)&&isEnded(f)&&!ids.has(f.id));
    if(!ex.length)return"";return`<details class="card"><summary><div><div class="sec-h" style="margin:0"><h2>Beendete Abos</h2></div><div class="small muted">${ex.length} ${ex.length===1?"Abo":"Abos"} · mit Verlauf</div></div></summary><div class="list" style="margin-top:6px">
    ${ex.map(([f,l])=>{const p=periods(f).filter(x=>x.a),la=p[p.length-1];return`<button class="li" data-fix="${l}:${f.id}"><div class="grow"><div class="t">${esc(f.n)}</div><div class="small muted">${p.length?ymLabel(p[0].from,1)+" – "+ymLabel(la.to,1):""} · total ${chf(paidSoFar(f,l==="fixYear"),0)}</div></div><span class="amt muted">${chf(la?.a||0)}${l==="fixYear"?" / J.":""}</span></button>`}).join("")}</div></details>`})()}
  ${others.length?`<details class="card"><summary><div><div class="sec-h" style="margin:0"><h2>Weitere Fixkosten</h2></div><div class="small muted">Als Abo zählen, wenn es eines ist</div></div></summary><div class="list" style="margin-top:6px">
    ${others.map(([f,l])=>`<div class="li"><span class="grow t">${esc(f.n)}</span><span class="small muted">${chf(valAt(f.h,nowYM()))}${l==="fixYear"?" / J.":""}</span><button class="link" data-aboon="${f.id}" style="margin-left:10px">+ Abo</button></div>`).join("")}
  </div></details>`:""}`}

function aboSheet(l,id){const a=aboList().find(x=>x.f.id===id);if(!a)return;const f=a.f,now=nowYM(),ed=editableYear()||true;
  const usedBefore=(f.h||[]).some(e=>e.from<now&&+e.a);
  openSheet(`<h3>${esc(f.n)}</h3>
    <div class="grid2" style="gap:12px"><div><div class="label">Pro Monat</div><div class="mid">${chf(a.perMonth)}</div></div><div><div class="label">Pro Jahr</div><div class="mid">${chf(a.perYear)}</div></div></div>
    ${a.ended?`<div class="small" style="color:var(--bad)">In Finanzgipfel gekündigt seit ${MONTHS[(f.h.filter(e=>e.from<=now).sort((x,y)=>y.from-x.from)[0].from%100)-1]}, aber am ${fmtD(a.paidAfterEnd.date)} noch ${chf(a.paidAfterEnd.a)} bezahlt. Prüfe, ob das Abo wirklich beendet ist.</div>`:
      `<div><div class="label" style="margin-bottom:6px">Einschätzung</div><div class="seg" role="group" aria-label="Einschätzung">${MARKS.map(([k,t])=>`<button data-mark="${k}" aria-pressed="${a.mark===k}">${t}</button>`).join("")}</div></div>`}
    ${histHtml(f,a.yearly)}
    <div><div class="label" style="margin-bottom:2px">Zahlungen</div><div class="list">${a.pays.slice(0,24).map(p=>`<div class="li"><span class="grow">${fmtD(p.date)}</span><span class="amt">${chf(p.a)}</span></div>`).join("")||'<div class="small muted" style="padding:6px 0">Noch keine Zahlung in „Fixkosten & Rechnungen“ erfasst. Trage eine Rechnung mit dieser Fixkosten-Position ein, dann zeigt Finanzgipfel die nächste Zahlung.</div>'}</div></div>
    <button class="link" id="aboOff" style="align-self:flex-start">Nicht als Abo zählen</button>
    <div class="row actions" style="gap:8px">${a.ended||a.endsAt?"":`<button class="btn danger" id="aboEnd">Kündigen</button>`}<button class="btn" style="flex:1" id="aboEdit">Betrag ändern</button></div>`,el=>{
    el.querySelectorAll("[data-mark]").forEach(b=>b.onclick=()=>{el.querySelectorAll("[data-mark]").forEach(x=>x.setAttribute("aria-pressed",x===b));saveAbo(id,{mark:b.dataset.mark})});
    el.querySelector("#aboOff").onclick=()=>{closeSheet();saveAbo(id,{on:false});toast(f.n+" zählt nicht mehr als Abo")};
    el.querySelector("#aboEdit").onclick=()=>{closeSheet();setTimeout(()=>fixSheet(l,id),30)};
    /* Already paid this month → it still counts this month and ends from next month. */
    const endFrom=a.pays.some(p=>p.y*100+p.m===now)?ymAdd(now,1):now;
    const e=el.querySelector("#aboEnd");if(e)e.onclick=()=>{if(!e.dataset.sure){e.dataset.sure=1;e.textContent=`Ab ${ymLabel(endFrom,1)} beenden?`;return}
      closeSheet();const s=JSON.parse(JSON.stringify(S.settings)),it=s[l].find(z=>z.id===id);
      if(it.h.some(x=>x.from<endFrom&&+x.a)){it.h=it.h.filter(x=>x.from<endFrom);it.h.push({from:endFrom,a:0})}else s[l]=s[l].filter(z=>z.id!==id);
      saveSettings(s);toast(`${f.n} gekündigt · letzter Monat ${ymLabel(ymAdd(endFrom,-1))}`)};
  })}

/* ---------- category management ---------- */
function catStats(){const t={};for(const k of Object.keys(S.months))(S.months[k].entries||[]).forEach(e=>{t[e.c]=t[e.c]||{n:0,a:0,last:""};t[e.c].n++;t[e.c].a+=+e.a||0;if(k>t[e.c].last)t[e.c].last=k});return t}
function vCats(){const st=catStats(),ar=archived(),names=[...new Set([...allCats(),...Object.keys(st)])];
  const row=n=>{const x=st[n]||{n:0,a:0,last:""};return`<button class="li" data-cat="${esc(n)}"><span class="sw" style="background:${catColor(n)}"></span><div class="grow"><div class="t">${esc(n)}</div><div class="small muted">${x.n} Einträge${x.last?` · zuletzt ${MSHORT[+x.last.slice(5)-1]} ${x.last.slice(0,4)}`:""}</div></div><span class="amt">${chf(x.a,0)}</span></button>`};
  const act=names.filter(n=>!ar.includes(n)).sort((a,b)=>(st[b]?.n||0)-(st[a]?.n||0)),arc=names.filter(n=>ar.includes(n)).sort();
  return`<button class="link" data-go="plan" style="align-self:flex-start">‹ Planung</button>
  <section class="card"><div class="sec-h"><h2>Aktive Kategorien</h2><span class="small muted">${act.length}</span></div><div class="small muted" style="margin-bottom:2px">Erscheinen beim Erfassen. Antippen zum Umbenennen, Zusammenlegen oder Archivieren.</div><div class="list">${act.map(row).join("")}</div></section>
  <section class="card"><div class="sec-h"><h2>Archiviert</h2><span class="small muted">${arc.length}</span></div><div class="small muted" style="margin-bottom:2px">Nicht mehr in der Auswahl. Alte Einträge bleiben erhalten und zählen weiter.</div><div class="list">${arc.map(row).join("")||'<div class="small muted" style="padding:8px 0">Keine</div>'}</div></section>`}
function catSheet(name){const ar=archived(),isAr=ar.includes(name),st=catStats()[name]||{n:0};
  formSheet({title:name,note:`${st.n} Einträge. Gibst du den Namen einer bestehenden Kategorie ein, werden beide zusammengelegt.`,
    fields:[{k:"n",label:"Name",v:name},{k:"ar",label:"Archiviert (nicht mehr in der Auswahl beim Erfassen)",type:"check",v:isAr}],

/* ---------- Auswertungen: spending calendar, weekdays, regular places ---------- */
function dayTotals(y=year()){const t={};for(let m=1;m<=12;m++)entries(m,y).forEach(e=>{const k=m*100+e.d;t[k]=(t[k]||0)+(+e.a||0)});return t}
/* Net salary as a flow: salary → savings / fixed costs / taxes / everyday budget. Tapping a group on the
   left shows its breakdown on the right (fixed costs as planned per month, everyday budget as the average

function flowChart(){const y=year(),m=openM(),t=ym(m),net=nettoAt(t),s0=S.settings;if(!net)return"";
  const per=f=>valAt(f.h,t),items=[...(s0.fix||[]).map(f=>({n:f.n,t:f.t,v:per(f)})),...(s0.fixYear||[]).map(f=>({n:f.n,t:f.t,v:per(f)/12}))].filter(x=>x.v>0);

  const bud=net-fixAt(t);
  const c2=[["Sparen & Vorsorge",sum("Sparen & Vorsorge"),"var(--good)"],["Fixkosten",sum("Fixkosten"),"var(--n200)"],["Steuern",sum("Steuern"),"var(--n1000)"],["Alltagsbudget",bud,"var(--accent)"]].filter(x=>x[1]>0);
  let sel=S.flowSel&&c2.some(x=>x[0]===S.flowSel)?S.flowSel:"Alltagsbudget";
  const cur=curMonth(y),ms=[];for(let k=1;k<Math.min(cur,13);k++)ms.push(k);if(!ms.length)ms.push(m);const n=ms.length;
  let c3,avg=false;
  if(sel==="Alltagsbudget"){avg=true;const tot={};let sp=0,bs=0;ms.forEach(k=>{entries(k,y).forEach(e=>{tot[e.c]=(tot[e.c]||0)+(+e.a||0)});sp+=spent(k,y);bs+=budgetFor(k,y)});
    const cats=Object.entries(tot).map(([c,v])=>[c,v/n]).sort((a,b)=>b[1]-a[1]),top=cats.slice(0,4),restV=sp/n-top.reduce((a,x)=>a+x[1],0),sur=(bs-sp)/n;
    c3=[...top.map(([c,v])=>[c,v,catColor(c)]),...(restV>0.5?[["Übrige",restV,"var(--muted)"]]:[]),...(sur>0.5?[["→ Hobbykonto",sur,"var(--good)"]]:[])]}
  else{const col=c2.find(x=>x[0]===sel)[2],list=items.filter(x=>grp(x)===sel).sort((a,b)=>b.v-a.v),top=list.slice(0,5),rest=list.slice(5).reduce((a,x)=>a+x.v,0);
    c3=[...top.map((x,i)=>[x.n,x.v,`color-mix(in srgb,${col} ${100-i*13}%,var(--surface2))`]),...(rest>0.5?[[`Übrige (${list.length-5})`,rest,"var(--muted)"]]:[])]}
  const W=340,H=290,g=8,x1=0,x2=126,x3=232,nw=11;
  const lay=(arr,minH)=>{const tot=arr.reduce((a,x)=>a+x[1],0),avail=H-g*(arr.length-1);let hs=arr.map(x=>Math.max(minH,x[1]/tot*avail));const k=avail/hs.reduce((a,b)=>a+b,0);hs=hs.map(h=>h*k);let yy=0;return arr.map((x,i)=>{const o={n:x[0],v:x[1],c:x[2],y:yy,h:hs[i]};yy+=hs[i]+g;return o})};
  const L2=lay(c2,22),L3=lay(c3,26);
  const rib=(xa,ya1,ya2,xb,yb1,yb2,col,op)=>{const mx=(xa+xb)/2;return`<path d="M${xa} ${ya1}C${mx} ${ya1} ${mx} ${yb1} ${xb} ${yb1}L${xb} ${yb2}C${mx} ${yb2} ${mx} ${ya2} ${xa} ${ya2}Z" fill="${col}" fill-opacity="${op}"/>`};
  let s=`<defs><clipPath id="fc1"><rect class="fc fc1" x="${x1+nw}" y="-2" width="${x2-x1-nw}" height="${H+4}"/></clipPath><clipPath id="fc2"><rect class="fc fc2" x="${x2+nw}" y="-2" width="${x3-x2-nw}" height="${H+4}"/></clipPath></defs><g clip-path="url(#fc1)">`,yy=0;const tot2=c2.reduce((a,x)=>a+x[1],0);
  L2.forEach(o=>{const hh=o.v/tot2*H;s+=rib(x1+nw,yy,yy+hh,x2,o.y,o.y+o.h,o.c,o.n===sel?.3:.14);yy+=hh});s+=`</g><g clip-path="url(#fc2)">`;
  const so=L2.find(o=>o.n===sel),tot3=c3.reduce((a,x)=>a+x[1],0);let ya=so.y;
  L3.forEach(o=>{const hh=o.v/tot3*so.h;s+=rib(x2+nw,ya,ya+hh,x3,o.y,o.y+o.h,o.c,.24);ya+=hh});s+=`</g>`;
  s+=`<rect x="${x1}" y="0" width="${nw}" height="${H}" rx="3" fill="var(--fg)" fill-opacity=".8"/>`;
  L2.forEach(o=>{const on=o.n===sel;s+=`<g data-flow="${esc(o.n)}" style="cursor:pointer"><rect x="0" y="${o.y-3}" width="${x2+nw+4}" height="${o.h+6}" fill="transparent"/>
    <rect x="${x2}" y="${o.y}" width="${nw}" height="${o.h}" rx="3" fill="${o.c}" ${on?'stroke="var(--fg)" stroke-width="2"':'fill-opacity=".55"'}/>
    <text x="${x2-6}" y="${o.y+o.h/2-2}" text-anchor="end" font-size="10.5" font-weight="${on?700:600}" fill="var(--fg)" ${on?"":'fill-opacity=".75"'}>${esc(o.n)}${on?"":" ›"}</text>
    <text x="${x2-6}" y="${o.y+o.h/2+10}" text-anchor="end" font-size="10" fill="var(--muted)">${chf(o.v,0)} · ${pct(o.v/net)}</text></g>`});
  L3.forEach(o=>{const two=o.h>=24,nm=o.n.length>17?o.n.slice(0,16)+"…":o.n;s+=`<g class="fn3"><rect x="${x3}" y="${o.y}" width="${nw}" height="${o.h}" rx="3" fill="${o.c}"/><text x="${x3+nw+6}" y="${o.y+o.h/2+(two?-2:3.5)}" font-size="10.5" font-weight="600" fill="var(--fg)">${esc(nm)}</text>${two?`<text x="${x3+nw+6}" y="${o.y+o.h/2+10}" font-size="10" fill="var(--muted)">${avg?"Ø ":""}${chf(o.v,0)} · ${pct(tot3?o.v/tot3:0)}</text>`:""}</g>`});
  return`<div class="row between" style="margin-bottom:8px"><span><span class="label">Netto ${MONTHS[m-1]}</span> <b>${chf(net)}</b></span><span class="small muted">Bereich antippen</span></div>
    <div class="chart"><svg id="flowSvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Wohin dein Nettolohn fliesst">${s}</svg></div>
    <div class="small muted" style="margin-top:6px">Rechts: ${avg?`wofür du das Alltagsbudget im Schnitt ausgibst (Ø ${n>1?MSHORT[ms[0]-1]+"–"+MSHORT[ms[n-1]-1]:MONTHS[ms[0]-1]})`:`${esc(sel)} pro Monat, jährliche Kosten ÷ 12`}.</div>`}
function vStats(){
  const y=year(),t0=today(),isCur=y===t0.getFullYear(),lastDay=isCur?new Date(y,t0.getMonth(),t0.getDate()):new Date(y,11,31);

  const q=p=>{if(!vals.length)return 0;const s=vals.slice().sort((a,b)=>a-b);return s[Math.min(s.length-1,Math.floor(p*s.length))]};
  const q1=q(.25),q2=q(.5),q3=q(.75);

  const wavg=wsum.map((s,i)=>wn[i]?s/wn[i]:0),wmax=Math.max(1,...wavg),wtop=wavg.indexOf(Math.max(...wavg)),WD=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];

  ${S.statTab==="habits"?`

      <div><div class="label">Ø pro Tag</div><div class="mid">${chf(elapsed?sum/elapsed:0,0)}</div></div>

/* ---------- Kauf-Check: what a purchase costs in working time, and a wish list with 30 days to think ---------- */
const WISH_DAYS=30;
function hourRate(){const s=S.settings,h=(+(s.workWeek??42.5)/5)*(+(s.workDays??227));const net=yearPay("netto",todayYear());return h>0?net/h:0}
function avgSurplus(){const y=todayYear(),c=curMonth(y);let s=0,n=0;for(let m=1;m<Math.min(c,13);m++){s+=budgetFor(m,y)-spent(m,y);n++}return n?s/n:0}
function buyResult(price){if(!(price>0))return'<div class="small muted">Gib einen Preis ein, dann siehst du, was der Kauf für dich bedeutet.</div>';
  const hr=hourRate(),hrs=hr?price/hr:0,dayH=(+(S.settings.workWeek??42.5))/5,days=dayH?hrs/dayH:0;
  const y=todayYear(),m=Math.min(Math.max(curMonth(y),1),12),hb=hobby(y).now,after=hb-price,sur=avgSurplus(),left=budgetFor(m,y)-spent(m,y);
  const fmtH=hrs<1?`${Math.round(hrs*60)} Minuten`:`${hrs.toFixed(1).replace(".",",")} Stunden`;
  return`<div class="list">
    <div class="li"><div class="grow"><div class="t">Arbeitszeit</div><div class="small muted">${days>=1?`≈ ${days.toFixed(1).replace(".",",")} Arbeitstage`:"weniger als ein Arbeitstag"}</div></div><span class="amt">${fmtH}</span></div>
    <div class="li"><div class="grow"><div class="t">Monatsbudget ${MONTHS[m-1]}</div><div class="small muted">noch ${chf(left)} übrig</div></div><span class="amt" style="color:${left>0&&price>left?"var(--bad)":"var(--fg)"}">${left>0?pct(Math.min(9.99,price/left))+" davon":"aufgebraucht"}</span></div>
  </div>`}
function vBuy(){const wl=(S.settings.wish||[]).slice(),t0=today(),day=864e5;
  const left=w=>WISH_DAYS-Math.floor((new Date(t0.getFullYear(),t0.getMonth(),t0.getDate())-new Date(w.added+"T00:00:00"))/day);

      <div style="text-align:right"><div class="amt">${chf(w.a)}</div><span class="pill ${done?"good":"idle"}">${done?"Bedenkzeit vorbei":`noch ${l} ${l===1?"Tag":"Tage"}`}</span></div></button>`}).join("")||'<div class="small muted" style="padding:8px 0">Noch leer. Setz etwas auf die Wunschliste und schlaf ein paar Nächte darüber.</div>'}

    const node=[...el.childNodes].find(n=>n.nodeType===3&&/\d/.test(n.textContent));if(!node)return;
    const txt=node.textContent,m=txt.match(/(-|−)?\d[\d’']*(?:\.(\d+))?/);if(!m)return;

/* Fixed costs: a changed amount is recorded from the current month on; months before keep theirs.
   Removing a cost that already counted in a past month ends it from now on (it disappears from the list). */
function fixSheet(list,id){
  if(!editableYear()){toast(year()+" ist abgeschlossen");return}
  const yearly=list==="fixYear",now=nowYM();const f=id?S.settings[list].find(x=>x.id===id):null;if(id&&!f)return;
  const ended=f&&isEnded(f),usedBefore=f&&(f.h||[]).some(e=>e.from<now&&+e.a);
  formSheet({title:f?f.n:(yearly?"Neue jährliche Fixkosten":"Neue Fixkosten"),
    note:(f?histHtml(f,yearly):"")+`<div class="small muted"${f?' style="margin-top:10px"':""}>${f?(ended?"Mit einem Betrag wieder aufnehmen, ab dem gewählten Monat.":"Änderung oder Kündigung gilt ab dem gewählten Monat, auch rückwirkend."):"Ein früherer Monat ist möglich, wenn die Kosten schon länger laufen."} Budgets abgeschlossener Monate bleiben unverändert.</div>`,
    fields:[{k:"n",label:"Bezeichnung",v:f?.n},{k:"a",label:yearly?"CHF pro Jahr":"CHF pro Monat",type:"num",v:f&&!ended?valAt(f.h,now):"",half:1},{k:"t",label:"Typ",type:"select",options:FIXTYPES,v:f?.t||"Sonstiges",half:1},
      {k:"from",label:ended?"Wieder aktiv ab":"Gilt ab",type:"select",options:monthChoices(),v:now}],
    onSave:x=>{const noAmt=x.a==null||isNaN(x.a);if(!x.n||(noAmt&&!ended)){toast("Bezeichnung und Betrag eingeben");return false}
      const s=JSON.parse(JSON.stringify(S.settings)),a=noAmt?0:r2(x.a),from=+x.from||now;
      if(f&&x.n!==f.n){/* renaming also renames the matching bills in every month */
        for(const k of Object.keys(S.months)){const d=S.months[k],inf=d.info||[];if(!inf.some(b=>b.p===f.n))continue;
          const nd={...d,info:inf.map(b=>b.p===f.n?{...b,p:x.n,n:b.n===f.n?x.n:b.n}:b)};S.months[k]=nd;setTimeout(()=>write("months/"+k,nd),0)}}
      if(f){const it=s[list].find(z=>z.id===id);it.n=x.n;it.t=x.t;if(!noAmt&&(a!==valAt(it.h,from)||it.h.some(e=>e.from>from))){it.h=it.h.filter(e=>e.from<from);it.h.push({from,a})}}
      else s[list].push({id:uid(),n:x.n,t:x.t,h:[{from,a}]});
      saveSettings(s);toast(`Gespeichert ab ${ymLabel(from)} · Budget ${MONTHS[now%100-1]}: CHF ${chf(nettoAt(now,s)-fixAt(now,s))}`)},
    deleteLabel:usedBefore?"Kündigen":"Löschen",
    onDelete:f&&!ended?v=>{const from=+v.from||now,s=JSON.parse(JSON.stringify(S.settings)),it=s[list].find(z=>z.id===id);
